name: Mirror Sync from Flathub

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Repository via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone --mirror https://github.com/flathub/cn.eeo.ClassIn.git repo-mirror
          cd repo-mirror

          git remote add downstream git@github.com:imngkhang/classin-flatpak-wrapper.git

          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          git push downstream "refs/heads/*:refs/heads/*" --force
          git push downstream "refs/tags/*:refs/tags/*" --force
